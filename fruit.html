<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Classifier — Teachable Machine</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- TensorFlow.js & Teachable Machine Image Library -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
    }
    .drop-active {
      border-color: #4f46e5 !important;
      background-color: #eef2ff !important;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50/40 to-sky-50 text-slate-800 flex flex-col justify-between">

  <!-- Main Container -->
  <main class="max-w-3xl w-full mx-auto px-4 py-10">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 text-xs font-medium mb-3">
        <span class="w-2 h-2 rounded-full bg-indigo-600 animate-pulse" id="status-dot"></span>
        <span id="model-status">กำลังโหลดโมเดล AI...</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 tracking-tight">
        ระบบจำแนกรูปภาพด้วย AI
      </h1>
      <p class="text-slate-500 mt-2 text-sm sm:text-base">
        อัปโหลด ลากไฟล์มาวาง หรือกด <kbd class="px-1.5 py-0.5 text-xs bg-white border border-slate-200 rounded shadow-sm">Ctrl + V</kbd> เพื่อวางรูปภาพให้โมเดลวิเคราะห์
      </p>
    </div>

    <!-- Card Container -->
    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-6 sm:p-8">
      
      <!-- Upload Zone -->
      <div id="drop-zone" class="relative border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center transition-all duration-200 cursor-pointer hover:border-indigo-400 hover:bg-slate-50/80">
        <input type="file" id="image-input" accept="image/*" class="hidden" />
        
        <!-- Empty State Prompt -->
        <div id="upload-prompt" class="flex flex-col items-center justify-center py-6">
          <div class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </div>
          <p class="text-base font-medium text-slate-700">คลิกเพื่อเลือกรูปภาพ หรือลากไฟล์มาวางที่นี่</p>
          <p class="text-xs text-slate-400 mt-1">รองรับไฟล์ JPG, PNG, WEBP</p>
        </div>

        <!-- Image Preview Container -->
        <div id="preview-wrapper" class="hidden flex-col items-center">
          <div class="relative group max-w-sm w-full mx-auto overflow-hidden rounded-xl shadow-md border border-slate-200 bg-slate-100">
            <img id="image-preview" src="" alt="Preview" class="w-full max-h-80 object-contain mx-auto" />
          </div>
          <button type="button" id="change-btn" class="mt-4 inline-flex items-center gap-1.5 text-sm font-medium text-indigo-600 hover:text-indigo-700 bg-indigo-50 hover:bg-indigo-100 px-4 py-2 rounded-xl transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            เปลี่ยนรูปภาพใหม่
          </button>
        </div>
      </div>

      <!-- Loading Spinner while predicting -->
      <div id="predict-loading" class="hidden mt-6 text-center py-4">
        <div class="inline-block w-6 h-6 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm text-slate-500 mt-2">กำลังวิเคราะห์รูปภาพ...</p>
      </div>

      <!-- Results Section -->
      <div id="result-section" class="hidden mt-8 pt-6 border-t border-slate-100">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold text-slate-800">ผลการวิเคราะห์</h2>
          <span id="top-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700"></span>
        </div>

        <!-- Progress Bars Container -->
        <div id="label-container" class="space-y-3.5"></div>
      </div>

    </div>
  </main>

  <footer class="text-center py-6 text-xs text-slate-400">
    Powered by TensorFlow.js &amp; Google Teachable Machine
  </footer>

  <script type="text/javascript">
    // ลิงก์โมเดล Teachable Machine ของคุณ
    const URL = "https://teachablemachine.withgoogle.com/models/uMAOC2JQD/";

    let model, maxPredictions;

    const statusDot = document.getElementById("status-dot");
    const modelStatus = document.getElementById("model-status");
    const dropZone = document.getElementById("drop-zone");
    const imageInput = document.getElementById("image-input");
    const uploadPrompt = document.getElementById("upload-prompt");
    const previewWrapper = document.getElementById("preview-wrapper");
    const imagePreview = document.getElementById("image-preview");
    const changeBtn = document.getElementById("change-btn");
    const predictLoading = document.getElementById("predict-loading");
    const resultSection = document.getElementById("result-section");
    const labelContainer = document.getElementById("label-container");
    const topBadge = document.getElementById("top-badge");

    // โหลดโมเดลทันทีที่เปิดหน้าเว็บ
    async function loadModel() {
      try {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        statusDot.classList.remove("bg-indigo-600", "animate-pulse");
        statusDot.classList.add("bg-emerald-500");
        modelStatus.textContent = "โมเดลพร้อมใช้งานแล้ว";
      } catch (error) {
        statusDot.classList.remove("bg-indigo-600", "animate-pulse");
        statusDot.classList.add("bg-rose-500");
        modelStatus.textContent = "โหลดโมเดลไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ";
        console.error("Error loading model:", error);
      }
    }

    loadModel();

    // คลิกเพื่ออัปโหลดไฟล์
    dropZone.addEventListener("click", (e) => {
      if (e.target !== changeBtn) {
        imageInput.click();
      }
    });

    changeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      imageInput.click();
    });

    imageInput.addEventListener("change", (e) => {
      if (e.target.files && e.target.files[0]) {
        handleFile(e.target.files[0]);
      }
    });

    // รองรับการลากไฟล์มาวาง (Drag & Drop)
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("drop-active");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("drop-active");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("drop-active");
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // รองรับการวางรูปภาพจาก Clipboard (Ctrl + V)
    window.addEventListener("paste", (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.type.indexOf("image") !== -1) {
          const file = item.getAsFile();
          handleFile(file);
          break;
        }
      }
    });

    // แสดงรูปตัวอย่างและเริ่มทำนายผล
    function handleFile(file) {
      if (!file.type.startsWith("image/")) {
        alert("กรุณาเลือกไฟล์รูปภาพเท่านั้น");
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        imagePreview.src = e.target.result;
        uploadPrompt.classList.add("hidden");
        previewWrapper.classList.remove("hidden");
        previewWrapper.classList.add("flex");

        // รอให้รูปโหลดเสร็จสมบูรณ์ก่อนส่งเข้าโมเดล
        imagePreview.onload = () => {
          predictImage();
        };
      };
      reader.readAsDataURL(file);
    }

    // ประมวลผลภาพด้วย Teachable Machine
    async function predictImage() {
      if (!model) {
        alert("กรุณารอสักครู่ โมเดลกำลังโหลด...");
        return;
      }

      resultSection.classList.add("hidden");
      predictLoading.classList.remove("hidden");

      // ให้เวลาเบราว์เซอร์อัปเดต UI เล็กน้อย
      await new Promise((resolve) => setTimeout(resolve, 100));

      const predictions = await model.predict(imagePreview);

      // เรียงลำดับจากความน่าจะเป็นสูงสุดไปต่ำสุด
      predictions.sort((a, b) => b.probability - a.probability);

      // แสดง Badge ของคลาสที่ตรงที่สุด
      const topResult = predictions[0];
      const topPercent = (topResult.probability * 100).toFixed(1);
      topBadge.textContent = `ตรงกับ: ${topResult.className} (${topPercent}%)`;

      // สร้างแถบแสดงผลลัพธ์แต่ละคลาส
      labelContainer.innerHTML = "";
      predictions.forEach((pred, index) => {
        const percent = (pred.probability * 100).toFixed(1);
        const isTop = index === 0;

        const barColor = isTop ? "bg-indigo-600" : "bg-slate-300";
        const textColor = isTop ? "text-indigo-700 font-semibold" : "text-slate-600";

        const itemHTML = `
          <div>
            <div class="flex justify-between text-sm mb-1 ${textColor}">
              <span>${pred.className}</span>
              <span>${percent}%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
              <div class="${barColor} h-3 rounded-full transition-all duration-500 ease-out" style="width: ${percent}%"></div>
            </div>
          </div>
        `;
        labelContainer.insertAdjacentHTML("beforeend", itemHTML);
      });

      predictLoading.classList.add("hidden");
      resultSection.classList.remove("hidden");
    }
  </script>
</body>
</html>
